sonar.organization=helmut-hoffer-von-ankershoffen
sonar.projectKey=helmut-hoffer-von-ankershoffen_steuermaschine
sonar.sources=src,plugins/heinzel/src
sonar.tests=tests,plugins/heinzel/tests
sonar.python.version=3.15
sonar.python.coverage.reportPaths=coverage.xml

# Test-only exclusions (owner-approved 2026-11-14): composite asserts (S9073) and several calls inside one
# pytest.raises block (S5778) are the pytest idiom here. Scoped to the test directories only.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6
sonar.issue.ignore.multicriteria.t1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.t1.resourceKey=tests/**/*
sonar.issue.ignore.multicriteria.t2.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.t2.resourceKey=plugins/heinzel/tests/**/*
sonar.issue.ignore.multicriteria.t3.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.t3.resourceKey=examples/*/tests/**/*
sonar.issue.ignore.multicriteria.t4.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.t4.resourceKey=tests/**/*
sonar.issue.ignore.multicriteria.t5.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.t5.resourceKey=plugins/heinzel/tests/**/*
sonar.issue.ignore.multicriteria.t6.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.t6.resourceKey=examples/*/tests/**/*
