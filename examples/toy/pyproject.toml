[project]
name = "steuermaschine-toy"
version = "0.0.1"
description = "Example steuermaschine plugin: a plain PR -> CI green -> merge -> tag project against a simulated forge."
requires-python = ">=3.12"
dependencies = ["steuermaschine"]

[project.entry-points."steuermaschine.plugins"]
toy = "steuermaschine_toy.plugin:plugin"

[tool.uv.sources]
steuermaschine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steuermaschine_toy"]
