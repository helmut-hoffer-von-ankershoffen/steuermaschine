# Units that bin/promote may switch live although their independent review is not approved (bin/review_gate.py).
# Empty on purpose. An entry is a reviewed change of this repository and needs all four fields:
#
# [[allow]]
# unit = "reviews/example.md"      # the review file of the unit
# reason = "why it may go live unreviewed"
# owner = "who carries the exception"
# expires = "2026-11-20"           # last day the entry holds
#
# A unit with a daemon, queue, head or release command can never be allowed.
