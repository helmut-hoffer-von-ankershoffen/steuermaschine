name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history; cz checks the pushed commits
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz
      - run: make install
      - name: Private-term deny-list (tree and commit messages)
        # The list lives in the repository secret PRIVATE_TERMS, never in the repository. On main a missing secret
        # fails closed; on a pull request from a fork (no secrets) it is skipped with a notice.
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.PRIVATE_TERMS }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CONFIDENTIAL_TERMS" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "::error::PRIVATE_TERMS secret missing"; exit 1; fi
            echo "::notice::PRIVATE_TERMS not available; term guard skipped"; exit 0
          fi
          uv run --no-build --script scripts/check_confidentiality.py --require
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD) ;; esac
          if [ "$GITHUB_REF" = refs/heads/main ]; then range=HEAD; else range="$BEFORE..HEAD"; fi
          uv run --no-build --script scripts/check_confidentiality.py --require --messages "$range"
      - name: Conventional Commits (the commits this push or PR adds)
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD) ;; esac
          if [ -n "$(git rev-list "$BEFORE..HEAD")" ]; then uv run cz check --rev-range "$BEFORE..HEAD"; fi
      - run: make check
      - run: make audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Coverage summary
        run: |
          pct=$(python3 -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot().get; print(int(100*(int(r('lines-covered'))+int(r('branches-covered')))/(int(r('lines-valid'))+int(r('branches-valid')))))")
          echo "### Coverage: $pct% (line + branch)" >> "$GITHUB_STEP_SUMMARY"
      - name: SonarQube Cloud token present?
        id: sonar
        run: echo "token=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud
        if: steps.sonar.outputs.token == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Cloud skipped
        if: steps.sonar.outputs.token != 'true'
        run: echo "::notice::SonarQube Cloud skipped - the SONAR_TOKEN secret is not set"

  test:
    # The supported Pythons, as in heinzel's CI: 3.12 to 3.15 on Linux on every run, plus macOS on main. The `check`
    # job above is the full gate (lint, types, coverage, secrets) on 3.12; these cells run the suite only.
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '[{"os":"macos-latest","python":"3.12"}]' || '[]') }}
    env:
      # uv's own Python builds, as `uv tool install` and the stable install use: the runner images carry a system 3.12
      # (a framework build on macOS) whose process shape the process-table tests do not model (bead ygtp).
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      # PyYAML (a commitizen dependency, unused by the tests) has no wheel for 3.15 yet: skip it instead of building.
      - run: uv sync --all-packages --locked --no-build --no-install-package pyyaml
      - name: Tests
        run: env -u GITHUB_ACTIONS -u FORCE_COLOR -u PY_COLORS uv run --no-sync pytest -q -p no:cacheprovider

  badge:
    # The coverage badge: an SVG on the orphan branch `badges`, shown by the README as a repository file (works for a
    # private repository, no external account).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Write badges/coverage.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot().get; print(int(100*(int(r('lines-covered'))+int(r('branches-covered')))/(int(r('lines-valid'))+int(r('branches-valid')))))")
          color=$([ "$pct" -ge 90 ] && echo brightgreen || { [ "$pct" -ge 75 ] && echo yellow || echo red; })
          curl --proto '=https' --tlsv1.2 -sSfL -o coverage.svg "https://img.shields.io/badge/coverage-${pct}%25-${color}"
          git init -q badges && mv coverage.svg badges/ && cd badges
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges && git add coverage.svg && git commit -q -m "ci: coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
