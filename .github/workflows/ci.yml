name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  integration:
    name: Integration checks
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history; cz checks the pushed commits
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.15"
          enable-cache: true
      - name: Public history guard (every pushed or proposed commit descends from the public root)
        # The private history before the public root must never reach this repository (scripts/public-root).
        run: python3 scripts/check_public_root.py --head "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz
      - run: make install
      - name: Private-term deny-list (tree and commit messages)
        # The list lives in the repository secret PRIVATE_TERMS, never in the repository. On main a missing secret
        # fails closed; on a pull request from a fork (no secrets) it is skipped with a notice.
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.PRIVATE_TERMS }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CONFIDENTIAL_TERMS" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "::error::PRIVATE_TERMS secret missing"; exit 1; fi
            echo "::notice::PRIVATE_TERMS not available; term guard skipped"; exit 0
          fi
          uv run --no-build --script scripts/check_confidentiality.py --require
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD) ;; esac
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            range=HEAD
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Scan every actual PR commit, not GitHub's synthetic merge commit identity.
            test -n "$PR_HEAD"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
            range="$BEFORE..$PR_HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          # Only the approved baseline's unchanged email, on verified owner squashes, can be exempted on main.
          # Local hooks and PR scans stay strict; messages, names and committer fields are always scanned.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            uv run --no-build --script scripts/check_confidentiality.py --require --messages "$range" --github-owner-squash
          else
            uv run --no-build --script scripts/check_confidentiality.py --require --messages "$range"
          fi
      - name: Conventional Commits (the commits this push or PR adds)
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD) ;; esac
          if [ -n "$(git rev-list "$BEFORE..HEAD")" ]; then uv run cz check --rev-range "$BEFORE..HEAD"; fi
      - run: make check
      - run: make audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Coverage summary
        run: |
          pct=$(python3 -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot().get; print(int(100*(int(r('lines-covered'))+int(r('branches-covered')))/(int(r('lines-valid'))+int(r('branches-valid')))))")
          echo "### Coverage: $pct% (line + branch)" >> "$GITHUB_STEP_SUMMARY"
      - name: SonarQube Cloud token present?
        id: sonar
        run: echo "token=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud skipped
        if: github.event_name == 'push' && steps.sonar.outputs.token != 'true'
        run: echo "::notice::SonarQube Cloud skipped - the SONAR_TOKEN secret is not set"
      - name: Submit main analysis to SonarQube Cloud
        # Release consumes the push CI conclusion. Main analysis stays asynchronous.
        if: github.event_name == 'push' && steps.sonar.outputs.token == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    # On PRs this is the existing second Linux test lane, now measuring coverage
    # on the exact head for Sonar. Integration checks still test the merge tree.
    name: ${{ github.event_name == 'pull_request' && 'SonarQube Cloud Quality Gate' || format('Test ({0}, Python {1})', matrix.os, matrix.python) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [ubuntu-24.04]
        python: ["3.15"]
        include: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '[{"os":"macos-15","python":"3.15"}]' || '[]') }}
    env:
      # uv's own Python builds, as the stable install uses, never a runner's system Python.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-packages --locked --no-build
      - name: Require native Apple Silicon Python 3.15
        if: matrix.os == 'macos-15'
        run: |
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.mac_ver()[0].split(".")[0] == "15" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 15) else "Expected macOS 15 arm64 and Python 3.15")'
      - name: Tests
        if: github.event_name == 'push'
        run: env -u GITHUB_ACTIONS -u FORCE_COLOR -u PY_COLORS uv run --no-sync pytest -q -p no:cacheprovider
      - name: Measure coverage on the exact pull request head
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          # Integration's make check enforces its coverage floor. This report gives Sonar exact-head coverage.
          env -u GITHUB_ACTIONS -u FORCE_COLOR -u PY_COLORS uv run --no-sync pytest -q -p no:cacheprovider \
            --cov=src --cov=plugins/heinzel/src --cov=bin --cov-report= --cov-fail-under=0
          # Report with the repository config so XML filenames retain the source directories.
          uv run --no-sync coverage xml --fail-under=0
          test -s coverage.xml
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git diff --quiet HEAD --
      - name: Verify this pull request's Sonar quality gate
        id: sonar-analysis
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
      - name: Require a verified pull request verdict
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          SCAN_OUTCOME: ${{ steps.sonar-analysis.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != success ]; then
            echo "::error::No passing Sonar quality gate for this pull request. See the analysis step for the reason."
            exit 1
          fi

  check:
    # Preserve the required check name and require both lanes on every PR.
    needs: [integration, test]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require integration and test results
        env:
          INTEGRATION: ${{ needs.integration.result }}
          TEST: ${{ needs.test.result }}
        run: test "$INTEGRATION" = success && test "$TEST" = success

  badge:
    # The coverage badge: an SVG on the orphan branch `badges`, shown by the README as a repository file (works for a
    # private repository, no external account).
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Write badges/coverage.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot().get; print(int(100*(int(r('lines-covered'))+int(r('branches-covered')))/(int(r('lines-valid'))+int(r('branches-valid')))))")
          color=$([ "$pct" -ge 90 ] && echo brightgreen || { [ "$pct" -ge 75 ] && echo yellow || echo red; })
          curl --proto '=https' --tlsv1.2 -sSfL -o coverage.svg "https://img.shields.io/badge/coverage-${pct}%25-${color}"
          git init -q badges && mv coverage.svg badges/ && cd badges
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges && git add coverage.svg && git commit -q -m "ci: coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
