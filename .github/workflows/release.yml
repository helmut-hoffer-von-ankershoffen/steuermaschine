name: Release
# Successful main push CI releases a merge whose tree matches its pull request head.
# Build both packages from the exact CI commit, publish them in lockstep, then mark Latest after acceptance.
# A refusal is red with its reason; only "already in a release" ends green with nothing done.
# Resume: "Re-run failed jobs" reuses the built files; a full rerun finds the draft of the same commit and takes its
# files, so PyPI and the release always carry the same bytes (uploads skip what is there).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
      actions: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
      pr: ${{ steps.gate.outputs.pr }}
      sha: ${{ github.event.workflow_run.head_sha }}
      started: ${{ steps.clock.outputs.at }}
    steps:
      - id: clock
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.15"
      - run: make install
      - name: Verify the merged PR source and select the next version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SM_RELEASE_REPO: ${{ github.repository }}
          SM_GATE_CREATORS: ${{ vars.GATE_REVIEW_CREATORS }}
        run: |
          git fetch --tags --force origin
          python3 bin/release_ci.py gate --sha "${{ github.event.workflow_run.head_sha }}"
      - name: Set the version of both packages; the plugin requires exactly this core (the tag is the source; no commit to main)
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          uv version "$VERSION" --frozen
          uv version --package steuermaschine-heinzel "$VERSION" --frozen
          sed -i "s/^    \"steuermaschine\",$/    \"steuermaschine==$VERSION\",/" plugins/heinzel/pyproject.toml
          grep -Fqx "    \"steuermaschine==$VERSION\"," plugins/heinzel/pyproject.toml || { echo "::error title=Not released::the plugin's lockstep pin could not be set"; exit 1; }
      - name: Build
        if: steps.gate.outputs.release == 'true'
        run: make build
      - name: The files carry the version, and the plugin pins the core
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          for name in steuermaschine steuermaschine_heinzel; do
            ls dist | grep -q "^${name}-${VERSION}-.*\.whl$" || { echo "::error title=Not released::dist has no ${name} ${VERSION} wheel"; ls dist; exit 1; }
          done
          unzip -p "dist/steuermaschine_heinzel-${VERSION}-py3-none-any.whl" "steuermaschine_heinzel-${VERSION}.dist-info/METADATA" | grep -Fqx "Requires-Dist: steuermaschine==${VERSION}" \
            || { echo "::error title=Not released::the plugin wheel does not require steuermaschine==${VERSION}"; exit 1; }
          unzip -p "dist/steuermaschine_heinzel-${VERSION}-py3-none-any.whl" "steuermaschine_heinzel-${VERSION}.dist-info/METADATA" | grep -Fqx "Requires-Dist: pyjwt[crypto]" \
            || { echo "::error title=Not released::the plugin wheel lacks the TestFlight client dependency"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.release == 'true'
        with:
          name: built
          path: dist/

  draft:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: dist/
      - name: Keep the files in a draft release (or resume the draft of this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/release_ci.py draft --version "${{ needs.build.outputs.version }}" --sha "${{ needs.build.outputs.sha }}" --dist dist
      - name: Split by package (core first on PyPI)
        run: |
          mkdir -p out/core out/plugin
          mv dist/steuermaschine_heinzel-* out/plugin/
          mv dist/steuermaschine-* out/core/
          [ -z "$(ls dist)" ] || { echo "::error title=Not released::unexpected files in dist: $(ls dist)"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: out/

  pypi:
    needs: [build, draft]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    outputs:
      done: ${{ steps.clock.outputs.at }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: out/
      - name: steuermaschine to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/core/
          skip-existing: true
      - name: steuermaschine-heinzel to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/plugin/
          skip-existing: true
      - id: clock
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft (this makes the tag on the merged commit); not Latest before the acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false --target "${{ needs.build.outputs.sha }}"
          fi
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)" = "${{ needs.build.outputs.sha }}" ] \
            || { echo "::error title=Not released::$TAG does not point at ${{ needs.build.outputs.sha }}"; exit 1; }

  accept:
    needs: [build, pypi, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: PyPI and the GitHub release carry the same files (sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            python3 bin/release_ci.py match --version "${{ needs.build.outputs.version }}" && exit 0
            sleep 30
          done
          exit 1
      - name: A clean container installs what a user installs and starts it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            if docker run --rm -e VERSION ghcr.io/astral-sh/uv:0.13.5-debian-slim sh -euc '
                cd "$(mktemp -d)"
                printf "%s\n" "[project]" "name = \"release-smoke\"" "plugin = \"heinzel\"" > steuermaschine.toml
                sm_from_pypi() {
                  uvx --python 3.15 --from "steuermaschine==$VERSION" --with "steuermaschine-heinzel==$VERSION" \
                    --no-build-package steuermaschine --no-build-package steuermaschine-heinzel "$@"
                }
                sm_from_pypi --refresh sm -h > help.txt
                cat help.txt
                grep -Fq "Commands, in the order of a working day" help.txt
                sm_from_pypi sm self config > config.txt
                cat config.txt
                grep -Fxq "project: release-smoke   plugin: heinzel (loaded)" config.txt
                sm_from_pypi sm self tree > tree.txt
                grep -q "^R sm alarm list" tree.txt'; then exit 0; fi
            echo "clean install or startup failed (attempt $i); waiting"; sleep 30
          done
          echo "::error title=Not accepted::v$VERSION does not install and start in a clean container; it stays published but not Latest"
          exit 1
      - name: Latest, and the stage timings on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ needs.build.outputs.pr }}" -q .merged_at)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > timings.json <<JSON
          {"version": "${{ needs.build.outputs.version }}", "sha": "${{ needs.build.outputs.sha }}", "pr": ${{ needs.build.outputs.pr }},
           "merged": "$merged", "ci_started": "${{ github.event.workflow_run.run_started_at }}", "ci_done": "${{ github.event.workflow_run.updated_at }}",
           "release_started": "${{ needs.build.outputs.started }}", "pypi": "${{ needs.pypi.outputs.done }}", "accepted": "$now",
           "release_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
          python3 -m json.tool timings.json > /dev/null
          gh release upload "$TAG" timings.json --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "| stage | at (UTC) |"; echo "|---|---|"
            python3 -c 'import json; d=json.load(open("timings.json")); [print(f"| {k} | {d[k]} |") for k in ("merged","ci_started","ci_done","release_started","pypi","accepted")]'
          } >> "$GITHUB_STEP_SUMMARY"
