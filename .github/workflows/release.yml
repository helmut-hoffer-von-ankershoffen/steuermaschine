name: Release
# Automatic: every merge to main whose CI is green and whose pull request carries the independent review verdict
# (`Gate review`: the Gate review workflow's check, or a status by an allowlisted login; bin/release_ci.py) is released: version, PyPI, tag and GitHub release. No manual dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.15"
      - run: make install
      - name: Gate (merged from a pull request with an independent verdict, not yet released) and next version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SM_GATE_CREATORS: ${{ vars.GATE_REVIEW_CREATORS }}
        run: |
          git fetch --tags --force origin
          python3 bin/release_ci.py gate --sha "${{ github.event.workflow_run.head_sha }}"
      - name: Set the version (the tag is the source; no commit to main)
        if: steps.gate.outputs.release == 'true'
        run: uv version "${{ steps.gate.outputs.version }}" --frozen
      - name: Build
        if: steps.gate.outputs.release == 'true'
        run: make build
      - name: The files carry the version
        if: steps.gate.outputs.release == 'true'
        run: ls dist | grep -q "${{ steps.gate.outputs.version }}" || { echo "::error::dist has no ${{ steps.gate.outputs.version }}"; ls dist; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.release == 'true'
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: needs.build.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Tag the merged commit and publish the GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* --repo "$GITHUB_REPOSITORY" --target "${{ needs.build.outputs.sha }}" \
            --title "v${{ needs.build.outputs.version }}" --generate-notes
